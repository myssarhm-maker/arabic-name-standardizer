<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arabic Name Standardizer</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>Arabic Name Standardizer</h1>

        <p class="subtitle">
            Standardize Arabic and English name spellings
        </p>

        <label for="nameInput">
            Enter name
        </label>

        <input
            id="nameInput"
            type="text"
            placeholder="e.g. Mohammed Ali"
            autocomplete="off"
        >

        <button id="standardizeButton">
            Standardize
        </button>

        <div id="result" class="result hidden">

            <div class="result-label">
                Standardized name
            </div>

            <div id="standardizedName" class="standardized-name"></div>

            <div id="status" class="status"></div>

        </div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
